# Có phí: Web Service Starter + persistent disk 1 GB.
# Render hiển thị chi phí trước khi người dùng xác nhận tạo dịch vụ.
services:
  - type: web
    name: daily-kho
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: DATA_DIR
        value: /app/data
      - key: COOKIE_SECURE
        value: "true"
      - key: SETUP_TOKEN
        generateValue: true
    disk:
      name: daily-kho-data
      mountPath: /app/data
      sizeGB: 1
